<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0b2447;--ink-soft:#14315c;--ink-deep:#071a37;
    --brand:#1d5fd8;--cta:#11a0d8;--accent:#f5c518;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:851px;height:315px;overflow:hidden}
  body{
    font-family:Inter,Arial,sans-serif;
    background:linear-gradient(120deg,var(--ink-deep) 0%,var(--ink) 55%,var(--ink-soft) 100%);
    position:relative;color:#fff;-webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Archivo Black",Inter,sans-serif;letter-spacing:-.01em;line-height:1.03;text-transform:uppercase}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
  /* mobile-safe centered content band */
  .stage{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 150px;
  }
  .logo{height:46px;width:auto;margin-bottom:14px}
  h1{font-size:33px;max-width:600px}
  h1 .accent{color:var(--cta)}
  .sub{margin-top:12px;font-size:14.5px;color:rgba(255,255,255,.82);font-weight:500;max-width:540px}
  .pills{margin-top:16px;display:flex;gap:8px}
  .pill{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.85);letter-spacing:.01em}
  .url{position:absolute;right:26px;bottom:18px;font-size:12px;font-weight:700;color:var(--cta);letter-spacing:.02em}
  .stamp{position:absolute;left:26px;top:22px;transform:rotate(-4deg);background:var(--accent);color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:11px;padding:6px 13px;border-radius:999px;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}
</style>
</head>
<body>
  <div class="glow" style="top:-90px;right:-60px;width:340px;height:340px;background:rgba(29,95,216,.45)"></div>
  <div class="glow" style="bottom:-120px;left:-40px;width:300px;height:300px;background:rgba(17,160,216,.32)"></div>

  <span class="stamp">Done-for-you</span>

  <div class="stage">
    <img class="logo" src="educare-leads-logo-white.png" alt="Educare Leads Marketing" />
    <h1 class="display">We fill your program to <span class="accent">capacity</span> in 90 days</h1>
    <p class="sub">Done-for-you enrollment marketing for daycares, private schools &amp; camps</p>
    <div class="pills">
      <span class="pill">Daycares</span>
      <span class="pill">Private Schools</span>
      <span class="pill">Camps</span>
    </div>
  </div>

  <span class="url">educareleads.com</span>
</body>
</html>
